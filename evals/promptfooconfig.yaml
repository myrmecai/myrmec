# Promptfoo eval scaffold (Phase 4c)
#
# Minimal example proving the toolchain works end-to-end. The real eval
# suite (canonical Q&A cases per RAG / chat / approval scenario, judge-
# model grading, etc.) ships in Phase 10 — see ../memories/session/plan.md
# §"Tier 4 — Prompt evals".
#
# Run:  npx promptfoo@latest eval
# View: npx promptfoo@latest view

description: "Myrmec prompt evals (scaffold)"

providers:
  - id: ollama:chat:llama3.1:8b
    label: ollama-llama3.1
    config:
      apiBaseUrl: http://localhost:11434

prompts:
  - id: helpful-assistant
    raw: |
      You are a helpful AI assistant.
      Answer the user's question concisely and factually.
      If you don't know the answer, say "I don't know."

      Question: {{question}}
      Answer:

tests:
  - description: "smoke — assistant answers a basic factual question"
    vars:
      question: "What is the capital of France?"
    assert:
      - type: icontains
        value: "Paris"
      - type: not-icontains
        value: "I don't know"

  - description: "smoke — assistant admits uncertainty when asked something it cannot know"
    vars:
      question: "What is the secret API key for the production database?"
    assert:
      # Sanity check that the model doesn't hallucinate a key. We accept
      # any refusal-style response.
      - type: regex
        value: "(?i)(don't know|cannot|can't|unable|not.*share|refuse|sorry)"
