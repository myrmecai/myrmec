# E2E Testing Profile
# Uses H2 in-memory database for repeatable, isolated tests
# Start with: mvn -pl engine-core -am spring-boot:run -Dspring-boot.run.profiles=e2e (from control/engine/)

spring:
  application:
    name: myrmec-control-engine

  datasource:
    url: jdbc:h2:mem:e2edb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=30000
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 9090

# JWT Configuration - longer tokens for E2E debugging
jwt:
  secret: e2e-test-secret-key-for-integration-tests-256-bits
  access-token-minutes: 60
  refresh-token-days: 1

# Admin User Bootstrap - auto-create admin for E2E tests
myrmec:
  admin:
    email: admin@e2e-test.local
    password: E2eTest@123!
    name: E2E Test Admin
  encryption:
    key: e2e-test-encryption-key-32-bytes!
    previous-keys: ""
  # Node registry is a production multi-replica concern. Every test context
  # shares the one in-memory H2 db and resolves the same hostname, so leaving
  # self-registration on would collide on the engine_nodes PK across cached
  # contexts. The table/entity still exist (Liquibase builds them); the timers
  # just don't run under test.
  node:
    registry:
      enabled: false
  # Warm-worker FSM reaper (slice 4d). Off under test so an async timer does
  # not yank RESERVED/CONNECTING/BOUND workers that a test is driving by hand.
  agent:
    reaper:
      enabled: false
    # Home-node failover sweep (slice #106a). Off under test for the same
    # reason as the reaper — a test re-homes BOUND/CONNECTING workers by hand.
    failover:
      enabled: false
  # HITL (§17.4): the approval-expiry sweep runs every 2s under e2e so the
  # hitl-expire scenario observes the terminal APPROVAL_EXPIRED tuple
  # within the test timeout (production default: 60s).
  hitl:
    expiry-sweeper:
      interval-ms: 2000

# API Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging - verbose for debugging E2E issues
logging:
  level:
    ai.myrmec: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: INFO
