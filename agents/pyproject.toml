[project]
name = "myrmec-agent"
version = "0.1.0"
description = "Myrmec Agent SDK for connecting to the Control Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myrmec"]

[tool.pytest.ini_options]
# Tier-1 unit tests live in ``tests/``; Tier-1 agent integration tests
# (require a live engine) live in ``e2e/``. The default collection picks up
# both. Use ``pytest tests`` for unit-only runs or ``pytest e2e`` for the
# integration set.
testpaths = ["tests", "e2e"]
# ``auto`` so async tests don't need the ``@pytest.mark.asyncio`` decorator
# everywhere — but we keep the decorator for explicit clarity.
asyncio_mode = "auto"
